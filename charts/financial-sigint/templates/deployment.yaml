apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "financial-sigint.fullname" . }}-gateway
  labels:
    {{- include "financial-sigint.componentLabels" (dict "component" "gateway" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "financial-sigint.componentLabels" (dict "component" "gateway" "Chart" .Chart "Release" .Release) | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "orchestrator.workers.main"]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          envFrom:
            - configMapRef:
                name: {{ include "financial-sigint.fullname" . }}-config
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "financial-sigint.fullname" . }}-secrets
            {{- end }}
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: telemetry
              mountPath: /app/data
      volumes:
        - name: telemetry
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "financial-sigint.fullname" . }}-telemetry
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "financial-sigint.fullname" . }}-dashboard
  labels:
    {{- include "financial-sigint.componentLabels" (dict "component" "dashboard" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "financial-sigint.componentLabels" (dict "component" "dashboard" "Chart" .Chart "Release" .Release) | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "streamlit"
            - "run"
            - "src/ui/dashboard.py"
            - "--server.port={{ .Values.dashboard.port }}"
            - "--server.address=0.0.0.0"
            - "--server.headless=true"
            - "--browser.gatherUsageStats=false"
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
          envFrom:
            - configMapRef:
                name: {{ include "financial-sigint.fullname" . }}-config
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "financial-sigint.fullname" . }}-secrets
            {{- end }}
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: telemetry
              mountPath: /app/data
              readOnly: true
      volumes:
        - name: telemetry
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "financial-sigint.fullname" . }}-telemetry
          {{- else }}
          emptyDir: {}
          {{- end }}
